<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RuChat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at 15% 20%,rgba(0,140,255,.22),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(0,70,255,.20),transparent 30%),
        linear-gradient(135deg,#020817,#06152e,#020817);
    color:white;
    min-height:100vh;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* HEADER */

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    border-bottom:1px solid rgba(0,170,255,.25);
    background:rgba(2,10,28,.82);
    backdrop-filter:blur(15px);
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:30px;
    font-weight:900;
    letter-spacing:2px;
    color:#00bfff;
    text-shadow:
        0 0 5px #00aaff,
        0 0 15px #008cff,
        0 0 30px #006eff;
}

.header-right{
    display:flex;
    gap:8px;
    align-items:center;
}

.header-btn{
    border:0;
    padding:10px 14px;
    border-radius:12px;
    color:white;
    background:linear-gradient(135deg,#075bff,#009dff);
    box-shadow:0 0 15px rgba(0,140,255,.3);
}

.header-btn:hover{
    box-shadow:0 0 25px rgba(0,170,255,.6);
}

/* LAYOUT */

.app{
    height:calc(100vh - 70px);
    display:flex;
}

.sidebar{
    width:300px;
    min-width:300px;
    border-right:1px solid rgba(0,170,255,.2);
    background:rgba(2,9,25,.75);
    backdrop-filter:blur(12px);
    display:flex;
    flex-direction:column;
}

.search{
    padding:15px;
}

.search input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(0,170,255,.3);
    outline:none;
    background:#07152d;
    color:white;
}

.search input:focus{
    border-color:#00aaff;
    box-shadow:0 0 15px rgba(0,170,255,.2);
}

.chats{
    overflow-y:auto;
    flex:1;
}

.chat-item{
    padding:13px 15px;
    display:flex;
    gap:12px;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.04);
    cursor:pointer;
}

.chat-item:hover,
.chat-item.active{
    background:rgba(0,130,255,.14);
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:linear-gradient(135deg,#006eff,#00c6ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.chat-info{
    min-width:0;
    flex:1;
}

.chat-name{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.last-message{
    color:#8ca3c0;
    font-size:13px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.online{
    color:#00e676;
    font-size:11px;
}

/* CHAT */

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    height:70px;
    padding:10px 18px;
    border-bottom:1px solid rgba(0,170,255,.2);
    background:rgba(3,12,30,.7);
    display:flex;
    align-items:center;
    gap:12px;
}

.chat-title{
    font-weight:bold;
}

.chat-status{
    color:#8399b5;
    font-size:12px;
    margin-top:3px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.empty{
    margin:auto;
    text-align:center;
    color:#7990ad;
}

.message{
    max-width:min(70%,600px);
    padding:9px 12px;
    border-radius:15px;
    background:#10213c;
    align-self:flex-start;
    word-break:break-word;
}

.message.mine{
    align-self:flex-end;
    background:linear-gradient(135deg,#075bff,#007fdf);
}

.message-author{
    font-size:11px;
    color:#6ecbff;
    margin-bottom:4px;
}

.mine .message-author{
    color:#d8f5ff;
}

.message-time{
    font-size:10px;
    opacity:.6;
    text-align:right;
    margin-top:5px;
}

.message-photo{
    max-width:300px;
    max-height:300px;
    border-radius:12px;
    display:block;
    margin-top:3px;
    cursor:pointer;
}

.composer{
    padding:12px;
    border-top:1px solid rgba(0,170,255,.2);
    display:flex;
    gap:8px;
    background:rgba(2,9,25,.8);
}

.composer input{
    flex:1;
    min-width:0;
    padding:13px;
    border-radius:14px;
    outline:none;
    border:1px solid rgba(0,170,255,.25);
    background:#07152d;
    color:white;
}

.send-btn,
.photo-btn{
    width:48px;
    border:0;
    border-radius:13px;
    color:white;
    background:linear-gradient(135deg,#075bff,#00aaff);
}

.photo-btn{
    background:#162c4d;
}

/* AUTH */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal{
    width:min(440px,100%);
    background:#06132a;
    border:1px solid rgba(0,170,255,.35);
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 50px rgba(0,110,255,.3);
}

.modal h2{
    margin-bottom:20px;
}

.field{
    margin-bottom:12px;
}

.field input,
.field textarea,
.select{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid rgba(0,170,255,.25);
    background:#081a35;
    color:white;
    outline:none;
}

.primary{
    width:100%;
    padding:13px;
    border:0;
    border-radius:12px;
    color:white;
    background:linear-gradient(135deg,#075bff,#00aaff);
    margin-top:8px;
}

.secondary{
    width:100%;
    padding:12px;
    border:1px solid rgba(0,170,255,.25);
    border-radius:12px;
    color:white;
    background:#0a1b34;
    margin-top:8px;
}

.close{
    float:right;
    border:0;
    background:none;
    color:#8da5c0;
    font-size:22px;
}

/* PROFILE */

.profile{
    padding:15px;
    border-top:1px solid rgba(0,170,255,.15);
}

.profile-line{
    display:flex;
    align-items:center;
    gap:10px;
}

.profile-email{
    font-size:13px;
    color:#9eb1c9;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profile-actions{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.profile-actions button{
    flex:1;
    padding:9px;
    border:0;
    border-radius:10px;
    color:white;
    background:#102747;
}

/* ADMIN */

.admin-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
}

.admin-section{
    background:#081a35;
    border:1px solid rgba(0,170,255,.18);
    border-radius:14px;
    padding:14px;
}

.admin-section h3{
    margin-bottom:10px;
    font-size:15px;
}

.admin-users{
    max-height:300px;
    overflow-y:auto;
}

.admin-user{
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.admin-user small{
    color:#7890ad;
    display:block;
    margin-top:4px;
    word-break:break-all;
}

.admin-user button{
    margin-top:7px;
    padding:7px 10px;
    border:0;
    border-radius:8px;
    color:white;
    background:#075bff;
}

/* RESPONSIVE */

@media(max-width:750px){

    .sidebar{
        width:100%;
        min-width:0;
    }

    .chat{
        display:none;
    }

    .sidebar.mobile-hidden{
        display:none;
    }

    .chat.mobile-show{
        display:flex;
        width:100%;
    }

    header{
        padding:0 12px;
    }

    .logo{
        font-size:23px;
    }

    .message{
        max-width:85%;
    }
}

@media(min-width:751px){
    #backBtn{
        display:none;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">RuChat</div>

    <div class="header-right">
        <button class="header-btn hidden" id="adminOpenBtn">
            ⚙️ Админ
        </button>

        <button class="header-btn" id="loginOpenBtn">
            👤 Войти
        </button>
    </div>
</header>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="search">
            <input
                id="searchInput"
                placeholder="🔎 Найти пользователя..."
            >
        </div>

        <div class="chats" id="chatList">

            <div class="chat-item" id="newsChat">
                <div class="avatar">📰</div>

                <div class="chat-info">
                    <div class="chat-name">Новости</div>

                    </div>
                </div>
            </div>

        </div>

        <div class="profile">

            <div class="profile-line">

                <div class="avatar" id="myAvatar">
                    ?
                </div>

                <div class="profile-email" id="myEmail">

                </div>

            </div>

            <div class="profile-actions">

                <button id="profileBtn" class="hidden">

                </button>

                </button>

        </div>

    </aside>

    <main class="chat" id="chat">

        <div class="chat-header">

            <button class="header-btn" id="backBtn">

            <div class="avatar" id="chatAvatar">
                ?
            </div>

            <div>
                <div class="chat-title" id="chatTitle">

                </div>

                <div class="chat-status" id="chatStatus">

                </div>
            </div>

        </div>

        <div class="messages" id="messages">

            <div class="empty">

        <div class="composer">

            <button
                class="photo-btn"
                id="photoBtn"
                title="Отправить фото"
            >
                📷
            </button>

            <input
                id="messageInput"
                placeholder="Введите сообщение..."
                autocomplete="off"
            >

            <button class="send-btn" id="sendBtn">
                ➤
            </button>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
                class="hidden"
            >

        </div>

    </main>

</div>


<!-- AUTH MODAL -->

<div class="overlay hidden" id="authOverlay">

    <div class="modal">

        <button class="close" onclick="closeModal('authOverlay')">
            ×
        </button>

        <h2 id="authTitle">Вход в RuChat</h2>

        <div class="field">
            <input
                id="emailInput"
                type="email"
                placeholder="Email"
            >
        </div>

        <div class="field">
            <input
                id="passwordInput"
                type="password"
                placeholder="Пароль"
            >
        </div>

        <button class="primary" id="authBtn">
            Войти
        </button>

        <button class="secondary" id="switchAuthBtn">
            Нет аккаунта? Регистрация
        </button>

        <div
            id="authError"
            style="color:#ff6b6b;margin-top:10px;font-size:13px"
        ></div>

    </div>

</div>


<!-- PROFILE MODAL -->

<div class="overlay hidden" id="profileOverlay">

    <div class="modal">

        <button class="close" onclick="closeModal('profileOverlay')">
            ×
        </button>

        <h2>👤 Профиль</h2>

        <div class="field">
            <input
                id="profileName"
                placeholder="Имя пользователя"
            >
        </div>

        <div class="field">
            <input
                id="avatarUrl"
                placeholder="Ссылка на аватар"
            >
        </div>

        <button class="primary" id="saveProfileBtn">
            Сохранить
        </button>

    </div>

</div>


<!-- USER MODAL -->

<div class="overlay hidden" id="userOverlay">

    <div class="modal">

        <button class="close" onclick="closeModal('userOverlay')">
            ×
        </button>

        <div id="userProfileContent"></div>

        <button
            class="secondary"
            id="blockUserBtn"
        >
            🚫 Заблокировать для себя
        </button>

        <button
            class="primary"
            id="startChatBtn"
        >
            💬 Написать сообщение
        </button>

    </div>

</div>


<!-- ADMIN MODAL -->

<div class="overlay hidden" id="adminOverlay">

    <div class="modal" style="max-width:700px">

        <button class="close" onclick="closeModal('adminOverlay')">
            ×
        </button>

        <h2>⚙️ Админ-панель</h2>

        <div class="admin-grid">

            <div class="admin-section">

                <h3>📢 Сообщение всем пользователям</h3>

                <div class="field">
                    <textarea
                        id="broadcastText"
                        rows="4"
                        placeholder="Напишите сообщение..."
                    ></textarea>
                </div>

                <button
                    class="primary"
                    id="broadcastBtn"
                >
                    Отправить всем
                </button>

            </div>


            <div class="admin-section">

                <h3>👑 Выдать права администратора</h3>

                <div class="field">
                    <input
                        id="newAdminUid"
                        placeholder="UID пользователя"
                    >
                </div>

                <button
                    class="primary"
                    id="addAdminBtn"
                >
                    Сделать администратором
                </button>

            </div>


            <div class="admin-section">

                <h3>👥 Пользователи</h3>

                <div
                    class="admin-users"
                    id="adminUsers"
                >
                    Загрузка...
                </div>

            </div>

        </div>

    </div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    addDoc,
    deleteDoc,
    query,
    where,
    orderBy,
    limit,
    getDocs,
    onSnapshot,
    serverTimestamp,
    arrayUnion,
    arrayRemove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* =========================================================
   ВСТАВЬ СЮДА СВОЙ FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey: "ВСТАВЬ_API_KEY",

    authDomain: "ВСТАВЬ_AUTH_DOMAIN",

    projectId: "ВСТАВЬ_PROJECT_ID",

    storageBucket: "ВСТАВЬ_STORAGE_BUCKET",

    messagingSenderId: "ВСТАВЬ_MESSAGING_SENDER_ID",

    appId: "ВСТАВЬ_APP_ID"

};


/* =========================================================
   UID ГЛАВНОГО АДМИНА
========================================================= */

const ADMIN_UID = "ВСТАВЬ_UID_ГЛАВНОГО_АДМИНА";


/* =========================================================
   FIREBASE INIT
========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let currentChat = null;

let currentChatUser = null;

let isRegister = false;

let messagesUnsubscribe = null;

let usersUnsubscribe = null;


/* =========================================================
   ELEMENTS
========================================================= */

const loginOpenBtn =
    document.getElementById("loginOpenBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const adminOpenBtn =
    document.getElementById("adminOpenBtn");

const profileBtn =
    document.getElementById("profileBtn");

const authOverlay =
    document.getElementById("authOverlay");

const profileOverlay =
    document.getElementById("profileOverlay");

const userOverlay =
    document.getElementById("userOverlay");

const adminOverlay =
    document.getElementById("adminOverlay");

const authTitle =
    document.getElementById("authTitle");

const authBtn =
    document.getElementById("authBtn");

const switchAuthBtn =
    document.getElementById("switchAuthBtn");

const emailInput =
    document.getElementById("emailInput");

const passwordInput =
    document.getElementById("passwordInput");

const authError =
    document.getElementById("authError");

const myEmail =
    document.getElementById("myEmail");

const myAvatar =
    document.getElementById("myAvatar");

const chatList =
    document.getElementById("chatList");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const photoBtn =
    document.getElementById("photoBtn");

const photoInput =
    document.getElementById("photoInput");

const chatTitle =
    document.getElementById("chatTitle");

const chatStatus =
    document.getElementById("chatStatus");

const chatAvatar =
    document.getElementById("chatAvatar");

const searchInput =
    document.getElementById("searchInput");

const sidebar =
    document.getElementById("sidebar");

const chat =
    document.getElementById("chat");


/* =========================================================
   MODALS
========================================================= */

window.closeModal = function(id){

    document
        .getElementById(id)
        .classList.add("hidden");

};


/* =========================================================
   AUTH UI
========================================================= */

loginOpenBtn.onclick = () => {

    authOverlay.classList.remove("hidden");

};

switchAuthBtn.onclick = () => {

    isRegister = !isRegister;

    if(isRegister){

        authTitle.textContent =
            "Регистрация в RuChat";

        authBtn.textContent =
            "Создать аккаунт";

        switchAuthBtn.textContent =
            "Уже есть аккаунт? Войти";

    }else{

        authTitle.textContent =
            "Вход в RuChat";

        authBtn.textContent =
            "Войти";

        switchAuthBtn.textContent =
            "Нет аккаунта? Регистрация";

    }

};


/* =========================================================
   LOGIN / REGISTER
========================================================= */

authBtn.onclick = async () => {

    authError.textContent = "";

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    if(!email || !password){

        authError.textContent =
            "Введите email и пароль.";

        return;

    }

    try{

        let result;

        if(isRegister){

            result =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            await setDoc(
                doc(db,"users",result.user.uid),
                {
                    uid:result.user.uid,
                    email:email,
                    name:email.split("@")[0],
                    avatar:"",
                    createdAt:serverTimestamp(),
                    lastSeen:serverTimestamp(),
                    blockedUsers:[]
                }
            );

        }else{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }

        closeModal("authOverlay");

        emailInput.value="";
        passwordInput.value="";

    }catch(error){

        console.error(error);

        authError.textContent =
            firebaseError(error.code);

    }

};


/* =========================================================
   FIREBASE ERRORS
========================================================= */

function firebaseError(code){

    const errors = {

        "auth/invalid-email":
            "Неверный email.",

        "auth/user-not-found":
            "Пользователь не найден.",

        "auth/wrong-password":
            "Неверный пароль.",

        "auth/email-already-in-use":
            "Этот email уже зарегистрирован.",

        "auth/weak-password":
            "Пароль слишком простой.",

        "auth/too-many-requests":
            "Слишком много попыток. Попробуйте позже."

    };

    return errors[code] ||
        "Произошла ошибка.";

}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(auth, async user => {

    currentUser = user;

    if(user){

        loginOpenBtn.classList.add("hidden");

        logoutBtn.classList.remove("hidden");

        profileBtn.classList.remove("hidden");

        myEmail.textContent =
            user.email || "Пользователь";

        await createUserIfMissing();

        await updateLastSeen();

        const admin =
            await isAdmin(user.uid);

        if(admin){

            adminOpenBtn.classList.remove("hidden");

        }else{

            adminOpenBtn.classList.add("hidden");

        }

        loadUsers();

        loadMyProfile();

    }else{

        loginOpenBtn.classList.remove("hidden");

        logoutBtn.classList.add("hidden");

        profileBtn.classList.add("hidden");

        adminOpenBtn.classList.add("hidden");

        myEmail.textContent =
            "Вы не авторизованы";

        myAvatar.textContent="?";

    }

});


/* =========================================================
   CREATE USER IF MISSING
========================================================= */

async function createUserIfMissing(){

    if(!currentUser) return;

    const userRef =
        doc(db,"users",currentUser.uid);

    const snap =
        await getDoc(userRef);

    if(!snap.exists()){

        await setDoc(
            userRef,
            {
                uid:currentUser.uid,
                email:currentUser.email,
                name:
                    currentUser.email.split("@")[0],
                avatar:"",
                createdAt:serverTimestamp(),
                lastSeen:serverTimestamp(),
                blockedUsers:[]
            }
        );

    }

}


/* =========================================================
   LAST SEEN
========================================================= */

async function updateLastSeen(){

    if(!currentUser) return;

    try{

        await updateDoc(
            doc(db,"users",currentUser.uid),
            {
                lastSeen:serverTimestamp()
            }
        );

    }catch(e){

        console.log(e);

    }

}

setInterval(
    updateLastSeen,
    60000
);


/* =========================================================
   STATUS
========================================================= */

function getLastSeen(timestamp){

    if(!timestamp)
        return "был(а) недавно";

    const date =
        timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);

    const diff =
        Math.floor(
            (Date.now()-date.getTime())/60000
        );

    if(diff <= 0)
        return "только что";

    if(diff === 1)
        return "1 мин. назад";

    if(diff < 60)
        return diff+" мин. назад";

    const hours =
        Math.floor(diff/60);

    if(hours === 1)
        return "1 час назад";

    if(hours < 24)
        return hours+" ч. назад";

    const days =
        Math.floor(hours/24);

    if(days === 1)
        return "1 день назад";

    return days+" дн. назад";

}

/* =========================================================
   LOAD MESSAGES
========================================================= */

function loadMessages(chatId){

    messages.innerHTML="";

    const messagesRef =
        collection(
            db,
            "chats",
            chatId,
            "messages"
        );

    const q =
        query(
            messagesRef,
            orderBy("createdAt","asc"),
            limit(300)
        );

    messagesUnsubscribe =
        onSnapshot(
            q,
            snapshot => {

                messages.innerHTML="";

                if(snapshot.empty){

                    messages.innerHTML=`
                        <div class="empty">
                            Сообщений пока нет
                        </div>
                    `;

                    return;

                }

                snapshot.forEach(docSnap => {

                    renderMessage(
                        docSnap.data()
                    );

                });

                messages.scrollTop =
                    messages.scrollHeight;

            },
            error => {

                console.error(
                    "Messages error:",
                    error
                );

                messages.innerHTML=`
                    <div class="empty">
                        Не удалось загрузить сообщения
                    </div>
                `;

            }
        );

}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(data){

    const div =
        document.createElement("div");

    const mine =
        data.uid ===
        currentUser?.uid;

    div.className =
        "message" +
        (mine ? " mine" : "");

    let content="";

    if(data.text){

        content += `
            <div>
                ${escapeHtml(data.text)}
            </div>
        `;

    }

    if(data.photo){

        content += `
            <img
                class="message-photo"
                src="${escapeHtml(data.photo)}"
                onclick="window.open(this.src,'_blank')"
            >
        `;

    }

    if(data.uid !== currentUser?.uid){

        content =
            `
            <div class="message-author">
                ${escapeHtml(data.name || "Пользователь")}
            </div>
            ` + content;

    }

    content += `
        <div class="message-time">
            ${formatMessageTime(data.createdAt)}
        </div>
    `;

    div.innerHTML=content;

    messages.appendChild(div);

}

async function sendMessage(){

            await isAdmin(currentUser.uid);

        if(!admin){

    const userSnap =
        await getDoc(

    const user =
        userSnap.data() || {};

    await addDoc(
        collection(

        {
            uid:currentUser.uid,
            name:
                user.name ||

    );

photoInput.onchange =
    async () => {

        const file =
            photoInput.files[0];

        if(!file)
            return;

        if(
            !file.type.startsWith("image/")
        ){

            alert(
                "Можно отправлять только изображения."
            );

            return;

        }

        if(
            file.size > 10 * 1024 * 1024
        ){

            alert(
                "Максимальный размер фото — 10 МБ."
            );

            return;

        }

        try{

            photoBtn.textContent="⏳";

            const path =
                "chatPhotos/" +
                currentUser.uid +
                "/" +
                Date.now() +
                "_" +
                file.name;

            const storageRef =
                ref(
                    storage,
                    path
                );

            await uploadBytes(
                storageRef,
                file
            );

            const url =
                await getDownloadURL(
                    storageRef
                );

            const userSnap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        currentUser.uid
                    )
                );

            const user =
                userSnap.data() || {};

            await addDoc(
                collection(
                    db,
                    "chats",
                    currentChat,
                    "messages"
                ),
                {
                    uid:currentUser.uid,
                    name:
                        user.name ||
                        currentUser.email,
                    text:"",
                    photo:url,
                    createdAt:
                        serverTimestamp()
                }
            );

        }catch(error){

            console.error(error);

            alert(
                "Не удалось отправить фото."
            );

        }finally{

            photoBtn.textContent="📷";

            photoInput.value="";

        }

    };

/* =========================================================
   FORMAT TIME
========================================================= */

function formatMessageTime(timestamp){

    if(!timestamp)
        return "...";

    const date =
        timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);

    return date.toLocaleTimeString(
        "ru-RU",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
